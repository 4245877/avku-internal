Match User avku-backup Address *,!192.168.0.151
    DenyUsers avku-backup

Match User avku-backup
    AuthorizedKeysFile /etc/ssh/authorized_keys.d/%u
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PubkeyAcceptedAlgorithms ssh-ed25519
    AuthorizedKeysCommand none
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    ChrootDirectory /srv/backup/avku-internal/sftp
    ForceCommand internal-sftp -d /incoming -u 0077 -l INFO -P symlink,hardlink,setstat,fsetstat,lsetstat,copy-data
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    DisableForwarding yes
    AllowTcpForwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    GatewayPorts no
    PermitListen none
    PermitOpen none

Match all
