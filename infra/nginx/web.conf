# Static-file server for the built AVKU web SPA, baked into an unprivileged
# nginx image (see apps/web/Dockerfile). The edge nginx (infra/nginx/app.conf)
# proxies `/` here and `/api/` to the API; this server only serves files, so it
# needs no upstreams, no secrets and no source.
server {
    # nginx-unprivileged listens high (non-root) by default.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # The "Вибори" building dataset is ~2.8 MB of JSON and compresses ~7:1, so
    # this is the difference between a usable map and a slow one.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        image/svg+xml
        text/css
        text/plain;

    # Fingerprinted build assets are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # OpenStreetMap snapshots. The filename is stable across deploys, so this
    # caches for an hour rather than forever.
    location /data/ {
        expires 1h;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths return index.html so client-side routing works.
    location / {
        try_files $uri /index.html;
    }
}
