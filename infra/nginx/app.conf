# Per-client rate-limit bucket for the API. Keyed on the connecting address, so
# it caps a single flooding host (e.g. a compromised LAN device hammering the
# unauthenticated API or the sharp-backed photo endpoint). Tunnel traffic all
# arrives from the cloudflared connector's address and therefore shares one
# bucket, so the rate is kept generous enough for normal multi-user and
# bulk-fill use; tune if legitimate bursts ever hit it.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# Cloudflare Access header hygiene (Phase 2). Only requests arriving with the
# tunnel's public Host may forward Cf-Access-* headers to the API; on the LAN
# vhost (any other Host) they are stripped to "", so a local client cannot
# inject a Cf-Access-Authenticated-User-Email. The API verifies the JWT
# signature regardless, so this is defence-in-depth, not the primary control.
map $host $cf_access_jwt {
    internal.avku.org $http_cf_access_jwt_assertion;
    default           "";
}
map $host $cf_access_email {
    internal.avku.org $http_cf_access_authenticated_user_email;
    default           "";
}

server {
    listen 80;
    server_name _;

    client_max_body_size 30m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Baseline hardening headers. `always` so they are also sent on error/proxied
    # responses. nosniff stops browsers MIME-sniffing uploaded photos into an
    # executable type; the rest are cheap defence-in-depth for an internal tool.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Origin-only, not "no-referrer": the OpenStreetMap tile usage policy asks
    # for a valid Referer so it can tell one application's traffic from another,
    # and a policy that strips it entirely is grounds for being blocked. This
    # value still leaks nothing beyond the host to third parties.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Content-Security-Policy tuned to what the built SPA actually loads: its own
    # same-origin bundles, the inline pre-paint theme script in index.html
    # ('unsafe-inline'), Google Fonts CSS/webfonts, and photo previews rendered
    # from blob:/data: URLs. object-src/base-uri are locked down; frame-ancestors
    # mirrors X-Frame-Options. Self-hosting the fonts later would let the two
    # fonts.* hosts be dropped for a stricter policy.
    #
    # img-src also carries the "Вибори" map: its base layers are *images* pulled
    # from third-party tile services, so an img-src of 'self' silently blocked
    # every tile — the map rendered its own polygons over blank space and the
    # «Супутник» switch looked like a button that did nothing. The hosts below
    # are exactly the ones `apps/web/src/features/elections/basemaps.js` can
    # request; keep the two lists in step. api.maptiler.com / api.mapbox.com are
    # only reached when the matching token is configured for the build.
    #
    # connect-src likewise carries the map: «Завантажити з OSM» queries the
    # Overpass API straight from the browser (see `overpassClient.js`), which a
    # connect-src of 'self' refused.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.basemaps.cartocdn.com https://server.arcgisonline.com https://api.maptiler.com https://api.mapbox.com; connect-src 'self' https://overpass-api.de https://overpass.kumi.systems https://overpass.private.coffee https://overpass.osm.jp; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    # Drop access to device APIs the app never uses (photos come from a file
    # picker, not the camera), shrinking the browser attack surface.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    # Hide nginx version in the Server header / error pages.
    server_tokens off;

    location /api/ {
        # Absorb short bursts (bulk fill / export) but cap sustained floods.
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forward Access identity for tunnel traffic; strip it on the LAN (an
        # empty value makes nginx omit the header entirely).
        proxy_set_header Cf-Access-Jwt-Assertion $cf_access_jwt;
        proxy_set_header Cf-Access-Authenticated-User-Email $cf_access_email;
    }

    location / {
        # The web container now serves the pre-built static SPA on 8080 (no
        # vite preview), so no WebSocket upgrade is needed here.
        proxy_pass http://web:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
