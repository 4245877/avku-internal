server {
    listen 80;
    server_name _;

    client_max_body_size 30m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Baseline hardening headers. `always` so they are also sent on error/proxied
    # responses. nosniff stops browsers MIME-sniffing uploaded photos into an
    # executable type; the rest are cheap defence-in-depth for an internal tool.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    # Hide nginx version in the Server header / error pages.
    server_tokens off;

    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
