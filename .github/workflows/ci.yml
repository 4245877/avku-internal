name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-checks:
    name: API typecheck & complete Docker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check API with fonts and recovery fixtures
        run: ./infra/scripts/check-api.sh

  web-checks:
    name: Web tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"

      - name: Enable corepack (pnpm)
        run: corepack enable && corepack prepare pnpm@11.9.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend tests
        run: pnpm test

      - name: Build frontend
        run: pnpm run build

  python-checks:
    name: Import and backup tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Phone importer
        run: python3 -B -m unittest discover -s scripts -p 'test_import_certificate_phones.py'
      - name: Backup extraction
        run: python3 -B -m unittest discover -s infra/certificate-backup -p 'test_extract.py'
      - name: Backup publisher
        run: python3 -B -m unittest discover -s infra/certificate-backup/server -p 'test_publisher.py'
