# Compatibility entrypoint for the installed systemd lifecycle unit.
# The image/build settings have one source of truth: release.yml.
services:
  api:
    extends:
      file: docker-compose.release.yml
      service: api
  web:
    extends:
      file: docker-compose.release.yml
      service: web
  backup-worker:
    extends:
      file: docker-compose.release.yml
      service: backup-worker
